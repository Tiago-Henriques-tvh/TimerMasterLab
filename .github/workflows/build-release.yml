name: Build Android Release APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'release/*'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Prepare Renamed APK
      run: |
        TAG_REF="${{ github.ref }}"
        if [[ "$TAG_REF" == refs/tags/release/* ]]; then
          VERSION="${TAG_REF#refs/tags/release/}"
          if [[ "$VERSION" == v* ]]; then
            APK_NAME="TimerMasterLab_${VERSION}.apk"
          else
            APK_NAME="TimerMasterLab_v${VERSION}.apk"
          fi
        else
          APK_NAME="TimerMasterLab-snapshot.apk"
        fi
        echo "Renaming APK to $APK_NAME"
        cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK_NAME"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TimerMasterNav-Release-APK
        path: app/build/outputs/apk/release/TimerMasterLab_*.apk

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/release/')
      with:
        files: app/build/outputs/apk/release/TimerMasterLab_*.apk
        generate_release_notes: true
